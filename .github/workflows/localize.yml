name: localize-images
on:
  workflow_dispatch:
  push:
    paths: ['scripts/localize.py']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/localize.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Localize images into assets/img [skip ci]"
          git push
